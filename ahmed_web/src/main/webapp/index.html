<!DOCTYPE html>
<!-- HTML comments like this... -->
<html>

<head>
    <title>Title Nav Using Flexbox</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="icons/more_icons/music_notes.png">

    <link href="style/blog.css" rel="stylesheet" type="text/css" />
    <!-- <link href="style/dropDown.css" rel="stylesheet" type="text/css" /> -->
    <link href="style/home.css" rel="stylesheet" type="text/css" />
    <link href="style/main.css" rel="stylesheet" type="text/css" />
    <link href="style/myDropDown.css" rel="stylesheet" type="text/css" />
    <link href="style/obj_CGF.css" rel="stylesheet" type="text/css" />
    <link href="style/obj.css" rel="stylesheet" type="text/css" />
    <link href="style/style.css" rel="stylesheet" type="text/css" />

    <!-- By referencing the Babel CDN, we can use JSX (HTML tags in JavaScript) 
         Asking for the latest minor version of babel major version 7. -->
    <script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <!-- This import Map defines nicknames for long URLs. -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6?deps=react@19"
      }
    }
    </script>

    <style>
    </style>

</head>

<body>
    <div id="root"></div>


    <!-- Put JS reusable first (these are called by CGFs or by the page like the dropDown FW). -->
    <script src="_JS_reusable/dropDownFW.js"></script>
    <script src="_JS_reusable/MakeObj.js"></script>

    <!-- JS Content Generating functions (these are called by the router). -->
    <script src="_JS_CGF/MakeObj_CGF.js"></script>

    <!-- React reusable (these are called by CGFs). -->
    <script type="text/babel" src="_React_reusable/ConvertEle.jsx"></script>

    <!-- React Content Generating functions (these are called by the router) -->
    <script type="text/babel" src="_React_CGF/HomeR.jsx"></script>
    <script type="text/babel" src="_React_CGF/BlogR.jsx"></script>

    <!-- Any React scripts (which typically have JSX) needs script type="text/babel" -->

    <script type="text/babel" data-type="module">

        //"use strict";


        import React from "react";
        import ReactDOM from "react-dom/client";
        import { HashRouter, Routes, Route, NavLink } from "react-router-dom";

        // Expose React globally so your JSX files can use it
        window.React = React;

        dropDownFW({
            dropHeaderStyle: "dropHeader",
            dropContentStyle: "dropContent",
            showStyle: "show",
            hideStyle: "hide"
        });


        const App = () => (
            <HashRouter>

                <div id="titleNav">
                    <div id="title">
                        Website Title
                    </div>
                    <div id="nav">
                        <div class="dropDown">
                            <NavLink to="/home">Home</NavLink>
                        </div>
                        <div class="dropDown">
                            <div class="dropHeader">Account</div>
                            <div class="dropContent">
                                <NavLink to="/register">Register</NavLink> <br />
                                <NavLink to="/login">Log In</NavLink> <br />
                                <NavLink to="/logout">Log Out</NavLink> <br />
                                <NavLink to="/profile">Get Profile</NavLink> <br />
                            </div>
                        </div>

                        <div class="dropDown">
                            <div class="dropHeader">Search</div>
                            <div class="dropContent">
                                <NavLink to="/usersReact">User List</NavLink> <br />
                                <NavLink to="/otherReact">[Other] List</NavLink> <br />
                            </div>
                        </div>

                        <div class="dropDown">
                            <div class="dropHeader">Homework</div>
                            <div class="dropContent">
                                <NavLink to="/blog">Blog</NavLink> <br />
                                <a target="_blank" href="docs/DB_proposal.pdf">My DB PDF</a> <br />
                                <NavLink to="/myObj">JS Object Component (sample)</NavLink> <br />
                                <a target="_blank" href="webUser/getAll">All Users Web API</a> <br />
                                <a target="_blank" href=".../getAll">All [Others] Web API</a> <br />
                            </div>
                        </div>
                    </div>
                </div>

                <div id="content">
                    <Routes>
                        <Route path="/" element={<HomeR />} />
                        <Route path="/home" element={<HomeR />} />
                        <Route path="/myObj" element={<ConvertEle ele={MakeObj_CGF()} />} />
                        <Route path="/blog" element={<BlogR />} />
                    </Routes>
                </div>

                <div id="footer">
                    Shaikh J Ahmed
                </div>

            </HashRouter>
        );

        // Create myRoot, a "React Root" (with a UI that React will "manage") 
        // in the the <div> with id "my-root". 
        const myRoot = ReactDOM.createRoot(document.getElementById("root"));
        myRoot.render(<App />);

    </script>

</body>

</html>
